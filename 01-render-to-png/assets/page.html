<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Render to PNG</title>
    <style>
      /* This page is rendered once, offscreen, and saved to a PNG (see the sample
         code). Nothing on it moves, so every run produces the same image. */
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      /* A View created straight from a Renderer maps the generic families to
         fixed defaults (Arial for sans-serif), so we name the fonts we want and
         let each platform pick the first one it has. */
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI",
                     Inter, "Helvetica Neue", Arial, sans-serif;
        color: rgba(242, 241, 251, 0.85);
        background-color: #0a0b1c;
        background-image:
          radial-gradient(circle at 50% -220px, rgba(141, 132, 174, 0.22), transparent 520px),
          radial-gradient(360px at 20% 30%, rgba(150, 70, 235, 0.22), rgba(150, 70, 235, 0.16) 30%,
                          rgba(150, 70, 235, 0.07) 55%, rgba(150, 70, 235, 0.02) 80%, transparent),
          radial-gradient(320px at 82% 38%, rgba(70, 110, 240, 0.22), rgba(70, 110, 240, 0.16) 30%,
                          rgba(70, 110, 240, 0.07) 55%, rgba(70, 110, 240, 0.02) 80%, transparent),
          radial-gradient(420px at 55% 110%, rgba(72, 60, 225, 0.2), rgba(72, 60, 225, 0.14) 30%,
                          rgba(72, 60, 225, 0.06) 55%, rgba(72, 60, 225, 0.02) 80%, transparent),
          radial-gradient(180px at 70% 78%, rgba(70, 150, 220, 0.12), rgba(70, 150, 220, 0.09) 30%,
                          rgba(70, 150, 220, 0.04) 55%, transparent);
      }

      /* A frosted glass panel: a faint white fill, a hairline edge with a brighter
         top highlight, and a blur of the washes behind it. */
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 44px 72px 40px;
        border-radius: 28px;
        background-color: rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.11),
                    inset 0 1px 0 rgba(255, 255, 255, 0.16),
                    inset 0 0 32px rgba(255, 255, 255, 0.05);
        backdrop-filter: saturate(1.8) brightness(1.03) blur(20px);
      }

      .mark {
        width: 124px;
        height: 124px;
      }

      /* The same lavender bloom as the mark: two tight shadows stack into a bright
         glow close to the letters, and a wide one spreads it out. Text shadows draw
         under the text, so the letters stay sharp. */
      h1 {
        margin: 20px 0 0;
        font-size: 40px;
        font-weight: 300;
        letter-spacing: 0.01em;
        text-shadow: 0 0 4px rgba(201, 194, 255, 0.5), 0 0 4px rgba(201, 194, 255, 0.5),
                     0 0 12px rgba(201, 194, 255, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="card">
    <!-- The Ultralight mark as SVG line art: a ring and two glass shards. Each
         shard shows a faint back edge, clipped to its face, for depth. -->
    <svg class="mark" viewBox="-140 -140 280 280" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linejoin="round">
      <defs>
        <clipPath id="upper-face"><polygon points="49,-109 -74,17 -11,13"/></clipPath>
        <clipPath id="lower-face"><polygon points="-44,110 81,-15 11,-13"/></clipPath>
        <g id="art">
          <circle r="130" stroke-opacity="0.65"/>

          <g clip-path="url(#upper-face)" stroke-opacity="0.55" stroke-width="1.4">
            <polygon points="48.8,-93 -74.2,33 -11.2,29"/>
            <path d="M 49 -109 l -0.2 16 M -74 17 l -0.2 16 M -11 13 l -0.2 16"/>
          </g>
          <polygon points="49,-109 -74,17 -11,13"/>

          <g clip-path="url(#lower-face)" stroke-opacity="0.55" stroke-width="1.4">
            <polygon points="-44.2,126 80.8,1 10.8,3"/>
            <path d="M -44 110 l -0.2 16 M 81 -15 l -0.2 16 M 11 -13 l -0.2 16"/>
          </g>
          <polygon points="-44,110 81,-15 11,-13"/>
        </g>
        <!-- Bloom: a tight and a wide blur of the line art, each brightened, tinted
             lavender, and merged. -->
        <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="near-blur"/>
          <feComponentTransfer in="near-blur" result="near">
            <feFuncA type="linear" slope="2.5"/>
          </feComponentTransfer>
          <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="far-blur"/>
          <feComponentTransfer in="far-blur" result="far">
            <feFuncA type="linear" slope="1.6"/>
          </feComponentTransfer>
          <feMerge result="glow">
            <feMergeNode in="far"/>
            <feMergeNode in="near"/>
          </feMerge>
          <feFlood flood-color="#c9c2ff"/>
          <feComposite in2="glow" operator="in"/>
        </filter>
      </defs>

      <!-- The bloom sits under the sharp line art, so the lines stay crisp. -->
      <use href="#art" filter="url(#bloom)" opacity="0.55"/>
      <use href="#art"/>
    </svg>

    <h1>Hello, Ultralight!</h1>
    </div>
  </body>
</html>

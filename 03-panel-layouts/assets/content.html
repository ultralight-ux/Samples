<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Content</title>
    <style>
      /* Ultralight sample design tokens, v2 (native-adaptive) */
      :root {
        --bg: #eef0f5;         /* window ground */
        --panel: #ffffff;      /* card / pane surface */
        --panel-2: #f6f7fa;    /* inset surface (inputs, code, table heads) */
        --text: #1b2030;
        --muted: #6b7186;
        --border: #e1e4ec;
        --accent: #3b6cf6;     /* primary action / selection */
        --accent-2: #7c3aed;   /* gradient partner, secondary series */
        --ok: #18a058;  --warn: #e8a317;  --bad: #e5484d;
        --sel: rgba(59, 108, 246, 0.12);   /* selection wash + focus ring */
        --shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
        --shadow-pop: 0 12px 28px rgba(16, 24, 40, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1117;  --panel: #171a23;  --panel-2: #1d2130;
          --text: #e6e8ef;  --muted: #8b91a6;  --border: #2a2f40;
          --accent: #4f8cff;  --accent-2: #a78bfa;
          --ok: #3ecf8e;  --warn: #ffb648;  --bad: #ff5c6c;
          --sel: rgba(79, 140, 255, 0.18);
          --shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
          --shadow-pop: 0 14px 36px rgba(0, 0, 0, 0.5);
        }
      }

      /* Each pane claims its own accent so splits and hides read at a glance. */
      :root { --accent: #18a058; }
      @media (prefers-color-scheme: dark) {
        :root { --accent: #3ecf8e; }
      }

      html, body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        box-sizing: border-box;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: sans-serif;
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
        cursor: default;
        -webkit-user-select: none;
        overflow: hidden;
      }

      .badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1),
                    box-shadow 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .badge:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .size {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        transition: color 240ms ease-out;
      }

      .size.live {
        color: var(--accent);
      }

      .note {
        max-width: 380px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
    <script>
      function update() {
        document.getElementById('size').textContent =
            window.innerWidth + ' × ' + window.innerHeight + ' px';
      }

      // A brief accent flash on the readout marks each live size change.
      let flashTimer = 0;
      function flash() {
        update();
        const size = document.getElementById('size');
        size.classList.add('live');
        clearTimeout(flashTimer);
        flashTimer = setTimeout(() => size.classList.remove('live'), 260);
      }
      addEventListener('DOMContentLoaded', update);
      addEventListener('resize', flash);
    </script>
  </head>
  <body>
    <div class="badge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"/>
        <path d="M7 12h10"/>
        <path d="M9.4 9.6 7 12l2.4 2.4"/>
        <path d="M14.6 9.6 17 12l-2.4 2.4"/>
      </svg>
    </div>
    <div class="label">Content</div>
    <div class="size" id="size"></div>
    <div class="note">
      This pane takes one flex share of the row's free space, so it absorbs whatever the sidebar
      gives up. Resize the window, drag the divider, or press B to hide the sidebar and watch
      every pane follow the layout tree.
    </div>
  </body>
</html>

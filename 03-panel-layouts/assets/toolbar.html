<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Toolbar</title>
    <style>
      /* Ultralight sample design tokens, v2 (native-adaptive) */
      :root {
        --bg: #eef0f5;         /* window ground */
        --panel: #ffffff;      /* card / pane surface */
        --panel-2: #f6f7fa;    /* inset surface (inputs, code, table heads) */
        --text: #1b2030;
        --muted: #6b7186;
        --border: #e1e4ec;
        --accent: #3b6cf6;     /* primary action / selection */
        --accent-2: #7c3aed;   /* gradient partner, secondary series */
        --ok: #18a058;  --warn: #e8a317;  --bad: #e5484d;
        --sel: rgba(59, 108, 246, 0.12);   /* selection wash + focus ring */
        --shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
        --shadow-pop: 0 12px 28px rgba(16, 24, 40, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1117;  --panel: #171a23;  --panel-2: #1d2130;
          --text: #e6e8ef;  --muted: #8b91a6;  --border: #2a2f40;
          --accent: #4f8cff;  --accent-2: #a78bfa;
          --ok: #3ecf8e;  --warn: #ffb648;  --bad: #ff5c6c;
          --sel: rgba(79, 140, 255, 0.18);
          --shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
          --shadow-pop: 0 14px 36px rgba(0, 0, 0, 0.5);
        }
      }

      html, body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        box-sizing: border-box;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-family: sans-serif;
        font-size: 13px;
        cursor: default;
        -webkit-user-select: none;
        overflow: hidden;
      }

      .badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        flex-shrink: 0;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }

      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .size {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        transition: color 240ms ease-out;
      }

      .size.live {
        color: var(--accent);
      }

      .hint {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .hint kbd {
        font-family: monospace;
        font-size: 11px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
      }
    </style>
    <script>
      function update() {
        document.getElementById('size').textContent =
            window.innerWidth + ' × ' + window.innerHeight + ' px';
      }

      // A brief accent flash on the readout marks each live size change.
      let flashTimer = 0;
      function flash() {
        update();
        const size = document.getElementById('size');
        size.classList.add('live');
        clearTimeout(flashTimer);
        flashTimer = setTimeout(() => size.classList.remove('live'), 260);
      }
      addEventListener('DOMContentLoaded', update);
      addEventListener('resize', flash);
    </script>
  </head>
  <body>
    <div class="badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5h18" opacity="0.9"/>
        <rect x="3" y="4" width="18" height="16" rx="2.5"/>
        <path d="M6.5 6.8h4"/>
      </svg>
    </div>
    <div class="label">Toolbar</div>
    <div class="size" id="size"></div>
    <div class="hint">Drag the divider between the panes &middot; Press <kbd>B</kbd> to toggle the sidebar</div>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Settings</title>
    <!-- This page runs no JavaScript: the application drives it through the native DOM API. -->
    <style>
      /* Ultralight sample design tokens, v2 (native-adaptive) */
      :root {
        --bg: #eef0f5;         /* window ground */
        --panel: #ffffff;      /* card / pane surface */
        --panel-2: #f6f7fa;    /* inset surface (inputs, code, table heads) */
        --text: #1b2030;
        --muted: #6b7186;
        --border: #e1e4ec;
        --accent: #3b6cf6;     /* primary action / selection */
        --accent-2: #7c3aed;   /* gradient partner, secondary series */
        --ok: #18a058;  --warn: #e8a317;  --bad: #e5484d;
        --sel: rgba(59, 108, 246, 0.12);   /* selection wash + focus ring */
        --shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
        --shadow-pop: 0 12px 28px rgba(16, 24, 40, 0.16);
      }

      /* The page follows the OS light/dark theme. Ultralight feeds the system
         theme to this media query, so the swap below happens live with no
         JavaScript. Note the page styles its own controls: built-in form
         controls always render with their light appearance. */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1117;  --panel: #171a23;  --panel-2: #1d2130;
          --text: #e6e8ef;  --muted: #8b91a6;  --border: #2a2f40;
          --accent: #4f8cff;  --accent-2: #a78bfa;
          --ok: #3ecf8e;  --warn: #ffb648;  --bad: #ff5c6c;
          --sel: rgba(79, 140, 255, 0.18);
          --shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
          --shadow-pop: 0 14px 36px rgba(0, 0, 0, 0.5);
        }
      }

      html, body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: sans-serif;
        font-size: 13px;
        line-height: 1.4;
        cursor: default;
        -webkit-user-select: none;
        overflow: hidden;
      }

      /* A soft accent wash behind the card keeps the ground from reading flat. */
      .wash {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(600px 380px at 30% 20%,
                          color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
          radial-gradient(520px 360px at 75% 85%,
                          color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 70%);
      }

      .card {
        position: relative;
        width: 384px;
        padding: 28px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        transition: box-shadow 200ms ease-out;
      }

      /* The card lifts while any control inside it has focus (:has() plus a
         transition, no script). */
      .card:has(:focus) {
        box-shadow: var(--shadow-pop);
      }

      .kicker {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 8px 0 4px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .lede {
        margin: 0 0 20px;
        color: var(--muted);
      }

      .rows {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        transition: background-color 160ms ease-out;
      }

      .row + .row {
        border-top: 1px solid var(--border);
      }

      .row:first-child { border-radius: 11px 11px 0 0; }
      .row:last-child  { border-radius: 0 0 11px 11px; }

      /* The row washes itself while its control has focus. */
      .row:has(:focus) {
        background: var(--sel);
      }

      .row label {
        font-weight: 600;
        transition: color 160ms ease-out;
      }

      /* The switch row's title picks up the accent while the switch is on. */
      .row:has(.switch:checked) label {
        color: var(--accent);
      }

      .row-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .hint {
        font-size: 12px;
        color: var(--muted);
      }

      /* A checkbox styled as a switch; the input stays real so change events fire. */
      .switch {
        -webkit-appearance: none;
        appearance: none;
        position: relative;
        width: 40px;
        height: 24px;
        margin: 0;
        flex-shrink: 0;
        background: color-mix(in srgb, var(--muted) 30%, var(--border));
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 160ms ease-out, box-shadow 160ms ease-out;
      }

      .switch::before {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.35);
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .switch:checked {
        background: var(--accent);
      }

      .switch:checked::before {
        transform: translateX(16px);
      }

      .switch:focus {
        outline: none;
        box-shadow: 0 0 0 3px var(--sel);
      }

      /* A select styled to match the page; the arrow is inline SVG layered over
         it so it can follow the theme (the built-in face never darkens). */
      .select {
        position: relative;
        display: inline-flex;
        align-items: center;
        flex-shrink: 0;
      }

      .select svg {
        position: absolute;
        right: 11px;
        color: var(--muted);
        pointer-events: none;
      }

      select {
        -webkit-appearance: none;
        appearance: none;
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 30px 6px 12px;
        min-width: 110px;
        cursor: pointer;
        transition: border-color 160ms ease-out, box-shadow 160ms ease-out;
      }

      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--sel);
      }

      .row-volume {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        row-gap: 10px;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        grid-column: 1 / -1;
        height: 24px;
        margin: 0;
        background: transparent;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--muted) 30%, var(--border));
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -6px;
        background: var(--accent);
        border: 2px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.35);
        cursor: pointer;
      }

      input[type="range"]:focus {
        outline: none;
      }

      input[type="range"]:focus::-webkit-slider-thumb {
        box-shadow: 0 0 0 3px var(--sel), 0 1px 3px rgba(16, 24, 40, 0.35);
      }

      /* The bar the application resizes natively as the slider moves. */
      .meter {
        width: 72px;
        height: 6px;
        background: color-mix(in srgb, var(--muted) 30%, var(--border));
        border-radius: 999px;
        overflow: hidden;
      }

      .meter div {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border-radius: 999px;
        transition: width 220ms ease-out;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
      }

      /* The dot is drawn with currentColor, so the native "dirty" class toggle
         recolors the dot and the text in one transition. */
      #status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
        transition: color 160ms ease-out;
      }

      #status::before {
        content: "";
        width: 7px;
        height: 7px;
        background: currentColor;
        border-radius: 50%;
      }

      #status.dirty {
        color: var(--warn);
      }

      .btn {
        padding: 8px 16px;
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1),
                    box-shadow 160ms cubic-bezier(0.2, 0.8, 0.2, 1),
                    background-color 160ms ease-out;
      }

      .btn:hover {
        background: color-mix(in srgb, var(--accent), #ffffff 10%);
        box-shadow: var(--shadow-pop);
        transform: translateY(-2px);
      }

      .btn:active {
        background: color-mix(in srgb, var(--accent), #000000 12%);
        box-shadow: var(--shadow);
        transform: translateY(0);
      }

      .btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--sel), var(--shadow);
      }

      /* The application writes the summary text natively; the page only styles it. */
      .readout {
        margin-top: 16px;
        padding: 12px 14px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .readout-label {
        margin-bottom: 5px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #summary {
        min-height: 17px;
        font-family: monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: pre-wrap;
      }

      #summary:empty::before {
        content: "Written by the application at runtime.";
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <div class="card">
      <div class="kicker">Ultralight &middot; DOM API</div>
      <h1>Settings</h1>
      <p class="lede">This page contains no JavaScript. Every read, write, and listener below
        is native code.</p>

      <div class="rows">
        <div class="row">
          <div class="row-text">
            <label for="notifications">Notifications</label>
            <span class="hint">Show alerts from the application.</span>
          </div>
          <input type="checkbox" class="switch" id="notifications" checked>
        </div>

        <div class="row">
          <div class="row-text">
            <label for="quality">Quality</label>
            <span class="hint">Rendering quality preset.</span>
          </div>
          <span class="select">
            <select id="quality">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
            <svg width="10" height="6" viewBox="0 0 10 6">
              <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
        </div>

        <div class="row row-volume">
          <div class="row-text">
            <label for="volume">Volume</label>
            <span class="hint">Sound output level.</span>
          </div>
          <div class="meter"><div id="volume-fill"></div></div>
          <input type="range" id="volume" min="0" max="100" value="40">
        </div>
      </div>

      <div class="actions">
        <span id="status">No changes yet.</span>
        <button class="btn" id="save">Save</button>
      </div>

      <div class="readout">
        <div class="readout-label">Summary</div>
        <div id="summary"></div>
      </div>
    </div>
  </body>
</html>
